# Builds all six pedals for macOS and Windows on every push/PR to main.
# Artifacts are unsigned — signing happens locally (Azure Trusted Signing on
# Windows via windows/build.ps1; Apple Developer ID via
# scripts/build-installer-macos.sh once an identity exists).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap gate: only run the heavy platform builds when code actually
  # changed. Skipped required checks count as satisfied, so docs/site-only
  # PRs merge fast while code PRs still need green builds on both platforms.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'Source/**'
              - 'common/**'
              - 'daydream/**'
              - 'fofopedal/**'
              - 'double/**'
              - 'backporch/**'
              - 'sway/**'
              - 'ui/**'
              - 'Resources/**'
              - 'CMakeLists.txt'
              - 'cmake/**'
              - '.github/workflows/build.yml'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build plugin UIs
        shell: bash
        run: |
          for d in ui daydream/ui fofopedal/ui double/ui backporch/ui sway/ui; do
            (cd "$d" && npm ci && npm run build)
          done

      - name: Install WebView2 SDK (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $v = "1.0.1901.177"
          $root = "$env:RUNNER_TEMP\webview2"
          $pkg = "$root\Microsoft.Web.WebView2.$v"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/$v" -OutFile "$root\wv2.zip"
          Expand-Archive "$root\wv2.zip" -DestinationPath $pkg -Force
          echo "WEBVIEW2_DIR=$root" >> $env:GITHUB_ENV

      - name: Configure (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:WEBVIEW2_DIR"

      - name: Configure (macOS)
        if: matrix.name == 'macos'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        shell: bash
        run: |
          for t in VROOM DAYDREAM FOFOPEDAL DOUBLE BACKPORCH SWAY; do
            cmake --build build --target "${t}_VST3" --config Release
            if [ "${{ matrix.name }}" = "macos" ]; then
              cmake --build build --target "${t}_AU" --config Release
            fi
          done

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          for t in VROOM DAYDREAM FOFOPEDAL DOUBLE BACKPORCH SWAY; do
            cp -R "build/${t}_artefacts/Release/VST3/${t}.vst3" out/
            if [ "${{ matrix.name }}" = "macos" ]; then
              cp -R "build/${t}_artefacts/Release/AU/${t}.component" out/
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sweet-papa-pedals-${{ matrix.name }}
          path: out/
